# Render Blueprint — deploys the Hiraticket Next.js app as a web service.
# Database + auth are provided by Supabase (managed separately), so this
# blueprint only declares the web service and its environment.
#
# Deploy: push to GitHub → Render → New → Blueprint → pick this repo.
# Then fill in every env var marked sync:false from the dashboard.
#
# ⚠️  OJO: los servicios que declara este archivo (`hiraticket`, `hiraticket-whatsapp`) están
# SUSPENDIDOS. Producción la sirven dos servicios creados a mano y con otro nombre:
#     hiraticket-1            srv-d9l5k3vqj5pc73ajfmh0   web    · plan standard
#     hiraticket-whatsapp-1   srv-d9l6m80ae00c738harlg   worker · plan starter
# Este archivo sigue siendo la referencia de CÓMO debe verse el despliegue, pero leerlo para saber
# el plan o las variables de producción MIENTE: eso vive solo en el panel. Cualquier cambio de aquí
# hay que replicarlo a mano en los `-1` (o por la API) hasta que se unifiquen.
#
# REGION: must stay `virginia`. Supabase lives in us-east-1, and running the app in Oregon
# put the whole continent between every query — ~68ms per round trip instead of ~2-5ms, on
# ~35 trips per navigation. Render cannot change a service's region after creation, so a
# service created in the wrong region has to be rebuilt from scratch.
services:
  - type: web
    name: hiraticket
    runtime: node
    plan: starter
    region: virginia
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /login
    autoDeploy: true
    # Sin esto, un cambio SOLO del worker reconstruye también la web —- y al revés. Peor que el
    # minuto de build: cada despliegue del worker tira el socket de WhatsApp de todos los negocios,
    # así que tocar un botón de la interfaz desconectaba a todo el mundo unos segundos.
    buildFilter:
      ignoredPaths:
        - services/whatsapp/**
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      # --- Supabase ---
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # --- Encryption keys: NEVER rotate these ---
      # MESSAGE_SECRET_KEY decrypts every message body stored as `encm:v1:`. It must be the
      # SAME value as the WhatsApp worker's, or outbound messages get marked failed with no
      # visible error. PLUGIN_SECRET_KEY decrypts stored plugin credentials. Losing either
      # loses the data it protects — there is no recovery.
      - key: MESSAGE_SECRET_KEY
        sync: false
      - key: PLUGIN_SECRET_KEY
        sync: false
      # --- Public URLs (used for OAuth callbacks, webhooks and email links) ---
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      # --- WhatsApp Cloud API (official / Tech Provider path) ---
      - key: WHATSAPP_CLOUD_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_TEST_WABA_ID
        sync: false
      - key: WHATSAPP_TEST_PHONE_NUMBER_ID
        sync: false
      - key: NEXT_PUBLIC_FB_APP_ID
        sync: false
      - key: NEXT_PUBLIC_WA_ES_CONFIG_ID
        sync: false
      # Comma-separated allowlist for who sees the official-WhatsApp onboarding.
      - key: WA_OFFICIAL_EMAILS
        sync: false
      # --- Mercado Pago ---
      - key: MP_INTEGRATOR_ID
        sync: false
      # --- Notificaciones push (Web Push / VAPID) ---
      # Se generan UNA vez con `npx web-push generate-vapid-keys` y NO se rotan: rotarlas invalida
      # todas las suscripciones existentes y cada agente tendría que volver a activar el push en
      # cada uno de sus dispositivos.
      - key: NEXT_PUBLIC_VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      # Contacto que los servidores de push (Google/Apple/Mozilla) usan para reportar problemas.
      - key: VAPID_SUBJECT
        sync: false
      # Secreto compartido con el worker de whatsmeow (mismo valor en los dos servicios).
      - key: PUSH_HOOK_SECRET
        sync: false

  # WhatsApp worker (whatsmeow, Go). Sessions persist in Postgres — no disk needed, and the
  # session survives a region move without rescanning the QR.
  - type: worker
    name: hiraticket-whatsapp
    runtime: docker
    dockerfilePath: ./services/whatsapp/Dockerfile
    dockerContext: ./services/whatsapp
    plan: starter
    region: virginia
    branch: main
    autoDeploy: true
    # El contexto de build es ./services/whatsapp y nada de fuera entra en la imagen, así que
    # cualquier otro cambio del repo no puede alterar este binario: reconstruirlo sería tirar la
    # sesión de WhatsApp de todos los negocios a cambio de nada.
    buildFilter:
      paths:
        - services/whatsapp/**
    envVars:
      # IMPORTANT: use the Supabase **Session pooler** (IPv4, port 5432). The direct
      # db.<ref>.supabase.co host is IPv6-only and Render can't reach it. Do NOT use the
      # transaction pooler (6543): whatsmeow's sqlstore needs session features.
      # postgresql://postgres.<ref>:PASSWORD@aws-1-<region>.pooler.supabase.com:5432/postgres?sslmode=require
      - key: DATABASE_URL
        sync: false
      # Used to store inbound media in the 'media' storage bucket.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Must match the web service's value exactly. Without it the worker still boots and
      # only prints a warning, then silently marks every encrypted outbound message failed.
      - key: MESSAGE_SECRET_KEY
        sync: false
      # Para avisarle a la app de los mensajes nuevos y que empuje la notificación. APP_URL es la
      # URL pública del servicio web; PUSH_HOOK_SECRET tiene que ser el MISMO valor que allá. Si
      # faltan, el worker arranca igual y solo avisa que no habrá push.
      - key: APP_URL
        sync: false
      - key: PUSH_HOOK_SECRET
        sync: false
