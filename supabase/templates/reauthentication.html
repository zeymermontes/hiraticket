<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="x-apple-disable-message-reformatting">
  <title>Tu código de verificación</title>
</head>
<body style="margin:0; padding:0; background:#F4F4F2; -webkit-font-smoothing:antialiased; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <div style="display:none; max-height:0; overflow:hidden; opacity:0;">Tu código de verificación de Hiraticket.</div>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F4F4F2;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="width:560px; max-width:100%; background:#FFFFFF; border-radius:16px; border:1px solid #ECEAE4; overflow:hidden;">
          <tr>
            <td style="padding:28px 36px 8px;">
              <table role="presentation" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="width:40px; height:40px; background:#F5C518; border-radius:11px; text-align:center; vertical-align:middle; font-weight:800; font-size:20px; color:#1A1606;">H</td>
                  <td style="padding-left:12px; font-weight:800; font-size:18px; color:#131310;">Hiraticket</td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:14px 36px 8px;">
              <h1 style="margin:0 0 10px; font-size:22px; line-height:1.3; color:#131310; font-weight:800;">Tu código de verificación</h1>
              <p style="margin:0 0 22px; font-size:15px; line-height:1.6; color:#56544C;">Usa este código para confirmar tu identidad. Caduca pronto por seguridad.</p>

              <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 0 8px;">
                <tr>
                  <td style="background:#FEF8E0; border:1px solid #FBE08A; border-radius:12px; padding:18px 28px; font-size:34px; font-weight:800; letter-spacing:8px; color:#131310; font-family:'SF Mono',Menlo,Consolas,monospace;">{{ .Token }}</td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:18px 36px 28px; border-top:1px solid #F0EEE8;">
              <p style="margin:0; font-size:12px; line-height:1.6; color:#A7A59B;">Si no solicitaste este código, ignora este correo y no lo compartas con nadie.</p>
              <p style="margin:8px 0 0; font-size:12px; line-height:1.6; color:#A7A59B;">Hiraticket · WhatsApp + pedidos para tu equipo</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
